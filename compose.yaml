services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg16-bookworm
    environment:
      POSTGRES_DB: ${DB_NAME:-glowjob}
      POSTGRES_USER: ${DB_USER:-glowjob}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-glowjob} -d ${DB_NAME:-glowjob}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
